[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prospectiq"
version = "0.1.0"
description = "ProspectIQ AI Lead Intelligence Engine — internal V0 core"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "ProspectIQ" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "sqlalchemy>=2.0.36",
  "asyncpg>=0.30.0",
  "alembic>=1.14.0",
  "structlog>=24.4.0",
  "httpx>=0.27.0",
  "beautifulsoup4>=4.12.0",
  "python-multipart>=0.0.9",
  "redis>=5.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
]

[project.scripts]
prospectiq-api = "prospectiq.api.main:run"
prospectiq-worker = "prospectiq.worker.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
markers = [
  "integration: PostgreSQL-backed integration tests (require prospectiq_test database)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["prospectiq"]
mypy_path = "src"
ignore_missing_imports = true
