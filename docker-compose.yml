services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: prospectiq
      POSTGRES_PASSWORD: prospectiq
      POSTGRES_DB: prospectiq
    ports:
      - "5432:5432"
    volumes:
      - prospectiq_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prospectiq -d prospectiq"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["uvicorn", "prospectiq.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - .env.example
    environment:
      PROSPECTIQ_DATABASE_URL: postgresql+asyncpg://prospectiq:prospectiq@postgres:5432/prospectiq
      PROSPECTIQ_REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "prospectiq.worker.main"]
    env_file:
      - .env.example
    environment:
      PROSPECTIQ_DATABASE_URL: postgresql+asyncpg://prospectiq:prospectiq@postgres:5432/prospectiq
      PROSPECTIQ_REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  prospectiq_pg:
